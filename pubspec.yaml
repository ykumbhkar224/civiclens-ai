name: civiclens_app
description: CivicLens AI - Civic accountability and appreciation platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Backend
  supabase_flutter: ^2.6.0

  # AI
  google_generative_ai: ^0.4.6

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # UI & UX
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2719.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  image_picker: ^1.1.2
  photo_view: ^0.15.0

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Networking & Serialization
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage & Utilities
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  # Note: flutter_secure_storage has limited web support; use shared_preferences for web fallback
  path_provider: ^2.1.4
  uuid: ^4.5.1
  intl: ^0.20.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  share_plus: ^10.0.2

  # flutter_dotenv removed — secrets injected at build time via --dart-define-from-file=.env

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5

# Force newer analyzer_plugin that works with analyzer 7.x
dependency_overrides:
  analyzer_plugin: ^0.13.0
  build_resolvers: ^2.5.4
  source_gen: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  # fonts:  # Uncomment after adding font files to assets/fonts/
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
